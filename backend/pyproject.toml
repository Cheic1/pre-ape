[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-ape-backend"
version = "1.0.0"
description = "Pre-APE Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.29.0",
    "sqlalchemy==2.0.30",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.4",
    "python-multipart==0.0.9",
    "python-docx==1.1.2",
    "weasyprint==62.1",
    "pillow==10.4.0",
    "openai==1.40.0",
    "anthropic==0.36.0",
    "ollama==0.3.0",
    "google-auth==2.29.0",
    "google-auth-oauthlib==1.2.0",
    "google-auth-httplib2==0.2.0",
    "httpx==0.27.0",
    "aiofiles==24.1.0",
    "python-jose==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.2.1",
    "redis==5.1.0",
    "celery==5.4.0",
    "prometheus-client==0.20.0",
    "structlog==24.1.0",
    "loguru==0.7.2",
    "opencv-python==4.9.0.80",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "httpx==0.27.0",
    "pytest-asyncio==0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]