[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-ape-backend"
version = "1.0.0"
description = "Pre-APE Backend API"
requires-python = ">=3.11"
# Runtime: only what the API process imports (keeps the image small enough
# for free PaaS tiers). Heavy, not-yet-wired features live in extras.
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.4",
    "python-jose==3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "httpx==0.27.0",
    "pytest-asyncio==0.23.0",
    "lxml>=5.2",  # XSD/DTD validation of the CENED XML export (tests only)
]
# AI vision (app/services/ai_vision_service.py — not wired into the API yet)
ai = [
    "aiohttp==3.9.5",
    "pillow==10.4.0",
    "loguru==0.7.2",
    "opencv-python-headless==4.9.0.80",
    "numpy==1.26.4",
    "openai==1.40.0",
    "anthropic==0.36.0",
    "ollama==0.3.0",
]
# Future features (Google OAuth/Drive, DOCX/PDF export, background jobs)
extras = [
    "google-auth==2.29.0",
    "google-auth-oauthlib==1.2.0",
    "python-docx==1.1.2",
    "weasyprint==62.1",
    "redis==5.1.0",
    "celery==5.4.0",
    "prometheus-client==0.20.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]