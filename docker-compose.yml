# Pre-APE — self-hosted stack (home server / any VPS).
#   cp .env.example .env   # then set SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up -d --build
# App + API on http://127.0.0.1:7032 (the cloudflared tunnel publishes it).
name: pre-ape

services:
  app:
    build: .
    image: pre-ape:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql://preape:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pre_ape
      CORS_ORIGINS: '["https://preape.cheic2.it"]'
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-7032}:7031"

  db:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: preape
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pre_ape
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preape -d pre_ape"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports: the database is reachable only from the app container.

volumes:
  pgdata:
