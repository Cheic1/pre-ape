# Render Blueprint — free web service built from the root Dockerfile.
# Dashboard → New → Blueprint → pick this repo. Then set DATABASE_URL to your
# Neon (or Supabase) connection string. SECRET_KEY is generated by Render.
services:
  - type: web
    name: pre-ape
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # base64 of 256 random bits (accepted by the app). Copy it from the
      # dashboard and back it up: losing it makes the documents unrecoverable.
      - key: DOCUMENTS_ENCRYPTION_KEY
        generateValue: true
