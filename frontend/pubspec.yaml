name: pre_ape
description: Pre-APE - Assistente digitale per la raccolta dati per la certificazione energetica degli edifici.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # STATE MANAGEMENT (used across lib/)
  flutter_riverpod: ^2.5.1

  # URL LAUNCHER – used to open OpenStreetMap from the address editor.
  url_launcher: ^6.2.0

  # Web interop for geolocation + fetch
  web: ^1.1.1

  # NOTE: camera, image_picker, geolocator, storage, etc. were listed here
  # with unpublished version pins and are imported by no file under lib/.
  # Re-add them (with valid versions) when the feature using them lands.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf